#cloud-config
growpart:
  mode: auto
  devices: ['/']
resize_rootfs: true
apt:
  primary:
    - arches: [default]
      uri: https://ports.ubuntu.com/ubuntu-ports
  security:
    - arches: [default]
      uri: https://ports.ubuntu.com/ubuntu-ports
package_update: true
packages:
  - ca-certificates
  - curl
  - golang-go
  - npm
runcmd:
  - |
    set -eu
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://apt.releases.hashicorp.com/gpg -o /etc/apt/keyrings/hashicorp.asc
    chmod a+r /etc/apt/keyrings/hashicorp.asc
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/hashicorp.asc] https://apt.releases.hashicorp.com noble main" > /etc/apt/sources.list.d/hashicorp.list
    curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
    chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    chmod a+r /etc/apt/keyrings/docker.asc
    cat > /etc/apt/sources.list.d/docker.sources <<'EOF'
    Types: deb
    URIs: https://download.docker.com/linux/ubuntu
    Suites: noble
    Components: stable
    Architectures: arm64
    Signed-By: /etc/apt/keyrings/docker.asc
    EOF
    apt-get update
    DEBIAN_FRONTEND=noninteractive apt-get install -y gh terraform docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
    curl -fsSL "https://github.com/gruntwork-io/terragrunt/releases/latest/download/terragrunt_linux_$(dpkg --print-architecture)" -o /usr/local/bin/terragrunt
    chmod 0755 /usr/local/bin/terragrunt
    systemctl enable --now docker.service
